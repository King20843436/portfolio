<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="card-custom col-md-5">
    <h3 class="text-center mb-4" style="color:var(--accent)">تسجيل الدخول</h3>
    <form method="POST">
      <input type="email" name="email" class="form-control mb-3" placeholder="الإيميل" required>
      <input type="password" name="password" class="form-control mb-3" placeholder="كلمة السر" required>
      <button type="submit" class="btn-main w-100">دخول</button>
    </form>
    <p class="text-center mt-3">ما عندك حساب؟ <a href="/register" style="color:var(--accent)">سجل هنا</a></p>
  </div>
</div>
</body>
</html>
