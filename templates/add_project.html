<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اضافة مشروع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
    <style>body{font-family:'Cairo'}</style>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-2xl mx-auto bg-slate-800 p-6 rounded-2xl">
        <h2 class="text-2xl font-bold mb-6 text-green-400">اضافة مشروع جديد</h2>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <input name="title" placeholder="اسم المشروع" required class="w-full p-3 bg-slate-700 rounded">
            <textarea name="description" placeholder="وصف المشروع" rows="4" required class="w-full p-3 bg-slate-700 rounded"></textarea>
            
            <label class="block">صورة المشروع</label>
            <input type="file" name="image" accept="image/*" required class="w-full p-2 bg-slate-700 rounded">

            <input name="project_url" placeholder="رابط المشروع" class="w-full p-3 bg-slate-700 rounded">
            
            <button class="bg-green-500 w-full py-3 rounded font-bold hover:bg-green-600">حفظ المشروع</button>
        </form>
    </div>
</body>
</html>
