<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشاء حساب</title>
    <style>
        body { background:#0f172a; color:white; font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
       .form-box { background:#1e293b; padding:30px; border-radius:10px; width:90%; max-width:400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align:center; color:#0ea5e9; margin-bottom:20px; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #334155; background:#0f172a; color:white; border-radius:5px; box-sizing: border-box; }
        button { width:100%; padding:12px; background:#0ea5e9; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; margin-top:10px; }
        button:hover { background:#0284c7; }
       .link { text-align:center; margin-top:15px; }
       .link a { color:#0ea5e9; text-decoration:none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>انشاء حساب جديد</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p style="color:#22c55e; text-align:center;">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="name" placeholder="الاسم" required>
            <input type="email" name="email" placeholder="الايميل" required>
            <input type="password" name="password" placeholder="كلمة السر" required>
            <button type="submit">تسجيل</button>
        </form>
        <div class="link">
            عندك حساب؟ <a href="{{ url_for('login') }}">سجل دخول</a>
        </div>
    </div>
</body>
</html>
