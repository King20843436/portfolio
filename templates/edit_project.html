<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل مشروع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Cairo'}</style>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-2xl mx-auto bg-slate-800 p-6 rounded-2xl">
        <h2 class="text-2xl font-bold mb-6 text-green-400">تعديل المشروع: {{ project.title }}</h2>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            
            <div>
                <label class="block mb-2 text-slate-300">اسم المشروع</label>
                <input name="title" value="{{ project.title }}" required class="w-full p-3 bg-slate-700 rounded border-slate-600 focus:border-green-500 outline-none">
            </div>

            <div>
                <label class="block mb-2 text-slate-300">وصف المشروع</label>
                <textarea name="description" rows="4" required class="w-full p-3 bg-slate-700 rounded border-slate-600 focus:border-green-500 outline-none">{{ project.description }}</textarea>
            </div>
            
            <div>
                <label class="block mb-2 text-slate-300">الصورة الحالية</label>
                {% if project.image_url %}
                <img src="{{ project.image_url }}" class="w-full h-48 object-cover rounded-lg mb-3">
                {% endif %}
                <label class="block mb-2 text-slate-400 text-sm">اتركها فاضية لو مش عايز تغير الصورة</label>
                <input type="file" name="image" accept="image/*" class="w-full p-2 bg-slate-700 rounded border-slate-600">
            </div>

            <div>
                <label class="block mb-2 text-slate-300">رابط المشروع</label>
                <input name="project_url" value="{{ project.project_url }}" class="w-full p-3 bg-slate-700 rounded border-slate-600 focus:border-green-500 outline-none">
            </div>
            
            <div class="flex gap-3">
                <button class="bg-green-500 w-full py-3 rounded font-bold hover:bg-green-600">حفظ التعديلات</button>
                <a href="{{ url_for('admin') }}" class="bg-slate-700 w-full py-3 rounded font-bold text-center hover:bg-slate-600">الغاء</a>
            </div>
        </form>
    </div>
</body>
</html>
