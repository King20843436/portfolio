<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>التعليم</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav class="navbar navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="/admin">← رجوع</a></div></nav>
<div class="container" style="padding-top:100px;"><div class="row g-4">
<div class="col-md-4"><div class="card-custom"><h5 style="color:var(--accent)">اضافة تعليم</h5>
<form method="POST"><input name="degree" class="form-control mb-2" placeholder="الشهادة - بكالوريوس حاسوب" required>
<input name="university" class="form-control mb-2" placeholder="الجامعة"><input name="year" class="form-control mb-2" placeholder="السنة 2020-2024">
<button class="btn-main w-100">اضافة</button></form></div></div>
<div class="col-md-8"><div class="card-custom"><h5 style="color:var(--accent)">التعليم</h5>
{% for e in educations %}<div class="p-3 mb-2 rounded" style="background:#0f172a; border:1px solid #334155;">
<b>{{ e.degree }}</b> - {{ e.university }} ({{ e.year }}) <a href="/delete_edu/{{ e.id }}" class="btn btn-danger btn-sm float-start">حذف</a></div>{% endfor %}</div></div></div></div></body></html>
